spring.main.web-application-type=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
logging.file.name=${WOODLOGIX_LOG_FILE:logs/woodlogix.log}
logging.level.root=INFO
logging.level.com.woodlogix=DEBUG
woodlogix.ui.window-width=1280
woodlogix.ui.window-height=820
woodlogix.ui.locale=pt-BR
woodlogix.proposals.directory=propostas
